<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>M1 The chain</title>
<meta name="description" content="Episode 1, section 6, second pass. A standing line figure in profile; the hypothalamus and pituitary marked in the head, the two adrenal glands capping the kidneys at the mid-back; the signal travels as one red dot from head to gland, cortisol appears at the gland, and a thin line returns to the head for the feedback.">
<meta name="motion:duration" content="13000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono&family=Barlow+Semi+Condensed:wght@700&display=swap">
<style>
  :root {
    --cream: #F7F3EC; --ink: #111111; --quiet: #6F6A62; --red: #B5291C; --rule: rgba(17,17,17,.14);
    --serif: "Instrument Serif", "Liberation Serif", "Times New Roman", serif;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
    --hand: cubic-bezier(.45,.05,.55,.95); /* a hand speeds up and slows down; nothing is swept */
  }
  html, body { margin: 0; background: var(--cream); }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
  svg.frame { display: block; width: 1920px; height: 1080px; }

  .line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .thin { stroke-width: 1.5; }
  .leader { stroke: var(--rule); stroke-width: 2; }
  .point { fill: var(--ink); }
  .mono { font-family: var(--mono); font-size: 36px; letter-spacing: .08em; text-transform: uppercase; fill: var(--quiet); }
  .serif { font-family: var(--serif); font-weight: 400; font-size: 120px; letter-spacing: -0.005em; fill: var(--ink); }

  /* Every stroke is drawn, not revealed: pathLength="1", dash offset 1 to 0, at a hand's pace. */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--d) var(--hand) var(--t) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* The site's one transition: opacity and an 8px rise over 400ms. */
  .in { opacity: 0; animation: enter 400ms ease-out var(--t) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* The signal: one red dot, from the hypothalamus past the pituitary to the gland. No line is
     drawn under it: the message to the adrenal goes by blood, not by nerve. */
  .signal {
    position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%;
    background: var(--red);
    offset-path: path("M 470 198 L 472 218 C 480 330, 566 450, 584 546");
    offset-rotate: 0deg; offset-distance: 0%;
    opacity: 0;
    animation: travel 1600ms var(--hand) 8500ms both, show 1ms linear 8500ms both;
  }
  @keyframes travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  @keyframes show { to { opacity: 1; } }
</style>
</head>
<body>
<svg class="frame" viewBox="0 0 1920 1080" aria-label="The hypothalamus, pituitary, adrenal chain on a standing figure">
  <defs>
    <!-- The hand: a slow noise field displaces every stroke by at most a pixel either way. -->
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#hand)">
    <!-- The figure, facing left, drawn as a hand would: head, neck, back, front, arm, legs -->
    <path class="line draw" pathLength="1" style="--t:300ms; --d:800ms"
      d="M 472 125 C 506 126, 532 156, 531 188 C 530 222, 500 246, 468 245 C 436 244, 410 218, 411 186 C 412 154, 438 126, 470 125" />
    <path class="line draw" pathLength="1" style="--t:1150ms; --d:250ms" d="M 508 238 L 520 274 M 446 238 L 441 272" />
    <path class="line draw" pathLength="1" style="--t:1500ms; --d:900ms"
      d="M 520 274 C 552 276, 592 286, 606 318 C 626 410, 622 520, 608 600 C 598 650, 604 700, 606 722" />
    <path class="line draw" pathLength="1" style="--t:2500ms; --d:800ms"
      d="M 441 272 C 428 290, 418 330, 422 380 C 416 450, 422 540, 430 610 C 433 660, 428 700, 436 722" />
    <path class="line draw" pathLength="1" style="--t:3400ms; --d:500ms" d="M 576 306 C 536 400, 505 520, 492 628" />
    <path class="line draw" pathLength="1" style="--t:4000ms; --d:600ms" d="M 470 726 C 474 810, 472 900, 468 982 L 418 988" />
    <path class="line draw" pathLength="1" style="--t:4650ms; --d:600ms" d="M 556 726 C 560 810, 564 900, 564 982 L 514 988" />

    <!-- In the head: the hypothalamus, and the pituitary hanging under it -->
    <circle class="point in" style="--t:5500ms" cx="470" cy="198" r="7" />
    <path class="line thin draw" pathLength="1" style="--t:5900ms; --d:200ms" d="M 470 205 L 472 214" />
    <circle class="point in" style="--t:6100ms" cx="472" cy="218" r="5" />

    <!-- At the mid-back: two kidneys, one a little behind the other, each capped by its adrenal -->
    <path class="line draw" pathLength="1" style="--t:6300ms; --d:500ms"
      d="M 544 542 C 560 541, 565 560, 563 580 C 561 596, 548 600, 540 592 C 533 585, 533 568, 536 556 C 538 548, 540 543, 544 542" />
    <path class="line draw" pathLength="1" style="--t:6850ms; --d:500ms"
      d="M 579 556 C 595 555, 600 575, 598 596 C 596 612, 583 616, 575 608 C 568 601, 568 584, 571 571 C 573 562, 575 557, 579 556" />
    <path class="line draw" pathLength="1" style="--t:7400ms; --d:250ms" d="M 536 544 C 540 532, 554 530, 561 540" />
    <path class="line draw" pathLength="1" style="--t:7700ms; --d:250ms" d="M 571 558 C 575 546, 589 544, 596 554" />

    <!-- The feedback: a thin line from the gland back up to the head -->
    <path class="line thin draw" pathLength="1" style="--t:10900ms; --d:1200ms"
      d="M 586 544 C 668 440, 706 270, 566 200 C 546 192, 516 194, 490 198" />
    <path class="line thin draw" pathLength="1" style="--t:12100ms; --d:200ms" d="M 504 189 L 490 198 L 504 208" />
  </g>

  <!-- Labels, in the mono, outside the drawing so they stay crisp -->
  <path class="line leader draw" pathLength="1" style="--t:5600ms; --d:300ms" d="M 458 198 L 400 198" />
  <text class="mono in" style="--t:5800ms" x="388" y="210" text-anchor="end">hypothalamus</text>
  <path class="line leader draw" pathLength="1" style="--t:6300ms; --d:300ms" d="M 464 222 L 400 252" />
  <text class="mono in" style="--t:6500ms" x="388" y="264" text-anchor="end">pituitary</text>
  <path class="line leader draw" pathLength="1" style="--t:8000ms; --d:300ms" d="M 606 582 L 632 582" />
  <text class="mono in" style="--t:8200ms" x="644" y="594">adrenal</text>

  <!-- Cortisol, released at the gland -->
  <text class="serif in" style="--t:10300ms" x="644" y="700">cortisol</text>
</svg>
<div class="signal" aria-hidden="true"></div>
</body>
</html>
