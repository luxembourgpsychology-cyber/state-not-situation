<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>M8 The verdict</title>
<meta name="description" content="Episode 1, sections 2 and 21. The verdict card as motion: nine words at display size, the word level turning red last.">
<meta name="motion:duration" content="6000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono&family=Barlow+Semi+Condensed:wght@700&display=swap">
<style>
  :root {
    --cream: #F7F3EC; --ink: #111111; --quiet: #6F6A62; --red: #B5291C;
    --serif: "Instrument Serif", "Liberation Serif", "Times New Roman", serif;
    --din: "Barlow Semi Condensed", "Liberation Sans Narrow", "Arial Narrow", Arial, sans-serif;
  }
  html, body { margin: 0; background: var(--cream); }
  html { font-size: 48px; }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative; box-sizing: border-box; padding: 2rem; color: var(--ink); }
  /* The TEXT layout: a label column, content from a third of the way across. */
  .card { display: grid; grid-template-columns: 11rem 1fr; column-gap: 1rem; height: 100%; }
  .label { font-family: var(--din); font-weight: 700; font-size: 0.75rem; letter-spacing: .16em; text-transform: uppercase; line-height: 1.35; color: var(--quiet); margin: 0; padding-top: 0.5rem; }
  .verdict { font-family: var(--serif); font-weight: 400; font-size: 3.75rem; line-height: 1.06; letter-spacing: -0.008em; margin: 0; }
  .w { display: inline-block; opacity: 0; animation: enter 400ms ease-out var(--t) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .level { animation: enter 400ms ease-out var(--t) both, redden 400ms ease-out 4200ms both; }
  @keyframes redden { to { color: var(--red); } }
</style>
</head>
<body>
<div class="card">
  <p class="label w" style="--t:300ms">The verdict</p>
  <p class="verdict"><span class="w" style="--t:600ms">A</span> <span class="w" style="--t:900ms">cortisol</span> <span class="w level" style="--t:1200ms">level</span> <span class="w" style="--t:1500ms">says</span> <span class="w" style="--t:1800ms">little</span> <span class="w" style="--t:2100ms">about</span> <span class="w" style="--t:2400ms">a</span> <span class="w" style="--t:2700ms">person's</span> <span class="w" style="--t:3000ms">stress.</span></p>
</div>
</body>
</html>
