<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>M4 The two clocks</title>
<meta name="description" content="Episode 1, section 9, third pass. The figure seated in profile, facing the clock. At stressor begins the heart in the chest jumps and a quickening pulse line leaves the chest to the right; the two adrenals, capping the kidneys at the back, stay still, and at about twenty minutes a slow line leaves the back, passes under the seat behind her and climbs to join the same timeline, peaking in the window of 21 to 40 minutes (Dickerson and Kemeny, 2004) while the heart line has long since settled.">
<meta name="motion:duration" content="14000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono&family=Barlow+Semi+Condensed:wght@700&display=swap">
<style>
  :root {
    --cream: #F7F3EC; --ink: #111111; --quiet: #6F6A62; --red: #B5291C; --rule: rgba(17,17,17,.14);
    --serif: "Instrument Serif", "Liberation Serif", "Times New Roman", serif;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
    --hand: cubic-bezier(.45,.05,.55,.95);
  }
  html, body { margin: 0; background: var(--cream); }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
  svg.frame { display: block; width: 1920px; height: 1080px; }
  .line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .rule { stroke: var(--rule); }
  .leader { stroke: var(--rule); stroke-width: 2; }
  .band { fill: var(--rule); }
  .mono { font-family: var(--mono); font-size: 36px; letter-spacing: .08em; text-transform: uppercase; fill: var(--quiet); }
  .serif { font-family: var(--serif); font-weight: 400; font-size: 77px; fill: var(--ink); }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--d) var(--hand) var(--t) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .in { opacity: 0; animation: enter 400ms ease-out var(--t) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade { opacity: 0; animation: fade 400ms ease-out var(--t) both; }
  @keyframes fade { to { opacity: 1; } }

  /* The clock. 0:00 is the moment the stressor begins; the pulse line reaches that moment
     at 8923ms, when the wipe below has travelled from the heart to the first minute. */
  .clock {
    position: absolute; right: 96px; top: 150px; margin: 0; opacity: 0;
    font-family: var(--mono); font-size: 120px; line-height: 1; letter-spacing: -0.03em; color: var(--ink);
    animation: enter 400ms ease-out 8100ms both, count 5000ms linear 8923ms both;
  }
  /* The count animation carries no property; it is the clock's timeline, read by the script
     below, so that a seek of the page's animations seeks the digits too. */
  @keyframes count { from { visibility: visible; } to { visibility: visible; } }

  /* The heart jumps at 0:00: five quick beats, then still. */
  .heart { transform-box: fill-box; transform-origin: center;
           animation: draw var(--d) var(--hand) var(--t) both, beat 240ms ease-in-out 8923ms 5; }
  @keyframes beat { 50% { transform: scale(1.16); } }

  /* The pulse line is revealed at the clock's own rate: a wipe from the heart to the right. */
  .wipe { transform-box: view-box; transform-origin: 560px 0; transform: scaleX(0);
          animation: wipe 5623ms linear 8300ms both; }
  @keyframes wipe { to { transform: scaleX(1); } }
</style>
</head>
<body>
<svg class="frame" viewBox="0 0 1920 1080" aria-label="A figure seated in profile: the heart in the chest answers in seconds, the adrenal glands at the back in tens of minutes">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <clipPath id="wipe"><rect class="wipe" x="560" y="0" width="1264" height="1080" /></clipPath>
    <!-- The lower leg, as a thing the cortisol line passes behind: the line is hidden where the shin is -->
    <mask id="behind">
      <rect x="0" y="0" width="1920" height="1080" fill="#fff" />
      <path fill="#000" d="M 736 742 L 790 742 L 788 960 L 738 960 Z" />
    </mask>
  </defs>

  <!-- The window in which salivary cortisol peaks: 21 to 40 minutes after the stressor begins -->
  <rect class="band fade" style="--t:12400ms" x="1093" y="350" width="356" height="370" />
  <text class="mono in" style="--t:12700ms" x="1271" y="322" text-anchor="middle">21 to 40 min</text>

  <g filter="url(#hand)">
    <!-- The figure, seated, in profile and facing right, drawn as a hand would:
         head, neck, back, front, thigh and shin, the back of the shin, the chair -->
    <path class="line draw" pathLength="1" style="--t:300ms; --d:800ms"
      d="M 580 240 C 614 241, 639 268, 638 302 C 637 336, 610 362, 576 361 C 544 360, 518 334, 519 300 C 520 266, 546 240, 578 240" />
    <path class="line draw" pathLength="1" style="--t:1150ms; --d:200ms" d="M 548 360 L 544 390 M 602 360 L 608 390" />
    <path class="line draw" pathLength="1" style="--t:1400ms; --d:700ms"
      d="M 544 390 C 500 394, 466 420, 468 470 C 458 560, 460 640, 480 732" />
    <path class="line draw" pathLength="1" style="--t:2150ms; --d:550ms"
      d="M 608 390 C 646 394, 662 430, 658 476 C 652 546, 642 612, 622 684" />
    <path class="line draw" pathLength="1" style="--t:2750ms; --d:700ms"
      d="M 622 684 C 666 678, 724 676, 754 690 C 778 700, 786 720, 782 752 C 780 820, 778 890, 776 950 L 828 956" />
    <path class="line draw" pathLength="1" style="--t:3500ms; --d:400ms" d="M 742 742 C 740 820, 742 890, 744 950" />
    <path class="line rule draw" pathLength="1" style="--t:4000ms; --d:500ms" d="M 440 956 L 440 736 L 724 736 L 724 956" />

    <!-- The heart, in the chest, behind the breastbone -->
    <path class="line draw heart" pathLength="1" style="--t:5600ms; --d:500ms"
      d="M 606 528 C 581 508, 572 482, 588 476 C 598 472, 605 482, 606 488 C 607 482, 614 472, 624 476 C 640 482, 631 508, 606 528" />

    <!-- At the back, at waist height: two kidneys, one a little behind the other, each capped by its adrenal -->
    <path class="line draw" pathLength="1" style="--t:6200ms; --d:400ms"
      d="M 533 580 C 517 579, 512 598, 514 618 C 516 634, 529 638, 537 630 C 544 623, 544 606, 541 594 C 539 586, 537 581, 533 580" />
    <path class="line draw" pathLength="1" style="--t:6600ms; --d:400ms"
      d="M 498 594 C 482 593, 477 613, 479 634 C 481 650, 494 654, 502 646 C 509 639, 509 622, 506 609 C 504 600, 502 595, 498 594" />
    <path class="line draw" pathLength="1" style="--t:7000ms; --d:200ms" d="M 541 582 C 537 570, 523 568, 516 578" />
    <path class="line draw" pathLength="1" style="--t:7200ms; --d:200ms" d="M 506 596 C 502 584, 488 582, 481 592" />

    <!-- The pulse line, from the heart out through the chest, revealed at the clock's rate -->
    <path id="pulse" class="line" clip-path="url(#wipe)" d="" />
    <!-- The cortisol line, from the gland at the back, drawn from twenty minutes on: it leaves
         backwards, passes under the seat behind her, and climbs to the same timeline -->
    <path id="cortisol" class="line draw" mask="url(#behind)" pathLength="1" style="--t:10590ms; --d:3333ms" d="" />
  </g>

  <path class="line leader draw" pathLength="1" style="--t:7400ms; --d:300ms" d="M 486 588 L 404 560" />
  <text class="mono in" style="--t:7600ms" x="392" y="572" text-anchor="end">adrenal</text>

  <text class="serif in" style="--t:8100ms" x="700" y="250">stressor begins</text>
</svg>
<p class="clock" aria-hidden="true"></p>
<script>
  // The clock's digits. The count animation on the clock is its timeline: 0:00 at the
  // moment the pulse line reaches the first minute, 60:00 five seconds later. The digits
  // are read off that animation on every frame, so a paused and seeked page shows the
  // right time and so does one playing on its own.
  const clock = document.querySelector('.clock');
  const show = () => {
    const a = clock.getAnimations().find(x => x.animationName === 'count');
    const p = a ? Math.min(1, Math.max(0, (a.currentTime - a.effect.getTiming().delay) / 5000)) : 0;
    const sec = Math.round(p * 3600), m = Math.floor(sec / 60), s = sec % 60;
    clock.textContent = m + ':' + String(s).padStart(2, '0');
    requestAnimationFrame(show);
  };
  show();

  // Nothing here is data. Dickerson and Kemeny (2004) give the two timings: the autonomic
  // response in seconds, cortisol the slower second wave, peaking in saliva 21 to 40 minutes
  // after the stressor begins. The pulse line's wiggle is a drawing of "beats faster, then
  // settles"; it is not a heart rate. The cortisol line's height and its fall are a drawing.
  const x0 = 700, x60 = 1824, px = (x60 - x0) / 60;
  const yh = 440;
  let d = `M 626 488 L ${x0} ${yh}`;
  let phase = 0;
  for (let x = x0; x <= x60; x += 2) {
    const s = x - x0;
    const period = 44 - 28 * Math.exp(-s / 160);      // quick at first, then the resting pace
    const amp = 5 + 65 * Math.exp(-s / 110);           // tall at first, then small
    phase += 2 * Math.PI * 2 / period;
    d += ` L ${x} ${(yh - amp * Math.sin(phase)).toFixed(1)}`;
  }
  document.getElementById('pulse').setAttribute('d', d);
  // From the adrenal nearest the back: out through the back, down and under the seat,
  // behind the shin, then slowly up to a peak at about thirty minutes, and down again.
  const xp = x0 + px * 30.5;
  document.getElementById('cortisol').setAttribute('d',
    `M 484 588 C 442 582, 408 628, 410 688 C 412 748, 470 770, 560 770 C 660 770, 730 770, 830 760 ` +
    `C 990 744, 1060 640, ${(xp - 150).toFixed(0)} 540 S ${(xp + 90).toFixed(0)} 500, ${(xp + 230).toFixed(0)} 516 ` +
    `C ${(xp + 370).toFixed(0)} 532, 1700 560, ${x60} 570`);
</script>
</body>
</html>
