<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>M3 After waking</title>
<meta name="description" content="Episode 1, section 7. The first thirty minutes after waking: free cortisol rises by roughly fifty to seventy-five percent (Pruessner et al., 1997).">
<meta name="motion:duration" content="6000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono&family=Barlow+Semi+Condensed:wght@700&display=swap">
<style>
  :root {
    --cream: #F7F3EC; --ink: #111111; --quiet: #6F6A62; --red: #B5291C; --rule: rgba(17,17,17,.14);
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  html, body { margin: 0; background: var(--cream); }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
  svg.frame { display: block; width: 1920px; height: 1080px; }
  .line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .rule { stroke: var(--rule); }
  .mono { font-family: var(--mono); font-size: 36px; letter-spacing: .08em; text-transform: uppercase; fill: var(--quiet); }
  .figure { font-family: var(--mono); font-size: 77px; letter-spacing: .08em; text-transform: uppercase; fill: var(--ink); }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--d) linear var(--t) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .in { opacity: 0; animation: enter 400ms ease-out var(--t) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<svg class="frame" viewBox="0 0 1920 1080" aria-label="Cortisol in the first thirty minutes after waking">
  <!-- The axis, 0 to 30 minutes -->
  <path class="line draw" pathLength="1" style="--t:300ms; --d:600ms" d="M 400 760 L 1520 760" />
  <g class="in" style="--t:900ms">
    <path class="line" d="M 400 760 L 400 780 M 773 760 L 773 780 M 1147 760 L 1147 780 M 1520 760 L 1520 780" />
    <text class="mono" x="400" y="830" text-anchor="middle">0</text>
    <text class="mono" x="773" y="830" text-anchor="middle">10</text>
    <text class="mono" x="1147" y="830" text-anchor="middle">20</text>
    <text class="mono" x="1520" y="830" text-anchor="middle">30</text>
    <text class="mono" x="960" y="900" text-anchor="middle">minutes after waking</text>
  </g>
  <!-- The level at waking, carried across as a rule -->
  <path class="line rule draw" pathLength="1" style="--t:1200ms; --d:400ms" d="M 400 700 L 1520 700" />
  <!-- The rise -->
  <path id="rise" class="line draw" pathLength="1" style="--t:1600ms; --d:2800ms" d="" />
  <!-- The figure, as the curve reaches the top -->
  <text class="figure in" style="--t:4300ms" x="1520" y="400" text-anchor="end">50 to 75 percent</text>
</svg>
<script>
  // Pruessner et al. (1997): free cortisol rises by roughly fifty to seventy-five percent in
  // the thirty minutes after waking. The curve is that rise, from the waking level to its top
  // at thirty minutes; its shape between the two ends is a drawing, not a measurement.
  const x0 = 400, x30 = 1520, y0 = 700, yTop = 440;
  let d = '';
  for (let i = 0; i <= 120; i++) {
    const t = 30 * i / 120;
    const v = (1 - Math.cos(Math.PI * t / 30)) / 2;
    d += (i ? ' L ' : 'M ') + (x0 + (x30 - x0) * t / 30).toFixed(1) + ' ' + (y0 - (y0 - yTop) * v).toFixed(1);
  }
  document.getElementById('rise').setAttribute('d', d);
</script>
</body>
</html>
