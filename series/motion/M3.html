<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>M3 After waking</title>
<meta name="description" content="Episode 1, section 7, second pass. The figure lies at the foot of the frame and sits up: waking. Beside it a short axis, 0 to 30 minutes after waking, with the waking level carried across as a rule; the curve rises out of the mouth, along the level and then up to its top at thirty minutes, where 50 to 75 percent lands (Pruessner et al., 1997).">
<meta name="motion:duration" content="12000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono&family=Barlow+Semi+Condensed:wght@700&display=swap">
<style>
  :root {
    --cream: #F7F3EC; --ink: #111111; --quiet: #6F6A62; --red: #B5291C; --rule: rgba(17,17,17,.14);
    --serif: "Instrument Serif", "Liberation Serif", "Times New Roman", serif;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
    --hand: cubic-bezier(.45,.05,.55,.95);
  }
  html, body { margin: 0; background: var(--cream); }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
  svg.frame { display: block; width: 1920px; height: 1080px; }
  .line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .rule { stroke: var(--rule); }
  .mono { font-family: var(--mono); font-size: 36px; letter-spacing: .08em; text-transform: uppercase; fill: var(--quiet); }
  .figure { font-family: var(--mono); font-size: 77px; letter-spacing: .08em; text-transform: uppercase; fill: var(--ink); }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--d) var(--hand) var(--t) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .in { opacity: 0; animation: enter 400ms ease-out var(--t) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* The figure lies on its back, head to the left; the torso turns about the hip and sits up: waking. */
  .torso { transform-box: view-box; transform-origin: 636px 950px; transform: rotate(-90deg);
           animation: situp 800ms var(--hand) 5300ms both; }
  @keyframes situp { from { transform: rotate(-90deg); } to { transform: rotate(0deg); } }
</style>
</head>
<body>
<svg class="frame" viewBox="0 0 1920 1080" aria-label="A figure wakes; cortisol rises from the mouth by fifty to seventy-five percent in the thirty minutes after waking">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#hand)">
    <!-- Where the figure lies -->
    <path class="line rule draw" pathLength="1" style="--t:300ms; --d:500ms" d="M 230 1012 L 990 1012" />

    <!-- The torso, written upright and turned to lie down; it sits up at waking. The same figure as M2. -->
    <g class="torso">
      <path class="line draw" pathLength="1" style="--t:1000ms; --d:600ms"
        d="M 672 590 C 697 591, 715 612, 714 636 C 713 660, 692 679, 668 678 C 644 677, 626 657, 627 633 C 628 609, 647 590, 670 590" />
      <path class="line draw" pathLength="1" style="--t:1650ms; --d:200ms" d="M 646 678 L 650 700 M 684 678 L 688 696" />
      <path class="line draw" pathLength="1" style="--t:1900ms; --d:600ms"
        d="M 650 700 C 624 701, 602 712, 596 740 C 582 810, 586 880, 600 950" />
      <path class="line draw" pathLength="1" style="--t:2550ms; --d:500ms"
        d="M 686 700 C 702 710, 708 760, 702 810 C 696 860, 700 910, 694 950" />
      <path class="line draw" pathLength="1" style="--t:3100ms; --d:400ms" d="M 614 718 C 644 770, 666 830, 674 890" />
    </g>
    <!-- The legs, lying out; they stay where they are when the figure sits up -->
    <path class="line draw" pathLength="1" style="--t:3550ms; --d:500ms" d="M 640 944 C 740 936, 840 938, 930 942 L 936 898" />
    <path class="line draw" pathLength="1" style="--t:3950ms; --d:400ms" d="M 640 962 C 740 954, 840 956, 925 960 L 931 916" />

    <!-- The rise, out of the mouth: along the waking level to the axis's zero, then up to thirty minutes -->
    <path id="rise" class="line draw" pathLength="1" style="--t:8400ms; --d:2600ms" d="" />
  </g>

  <!-- The half hour, in the mono, beside the figure -->
  <path class="line draw" pathLength="1" style="--t:6400ms; --d:700ms" d="M 1000 820 L 1720 820" />
  <g class="in" style="--t:7200ms">
    <path class="line" d="M 1000 820 L 1000 838 M 1240 820 L 1240 838 M 1480 820 L 1480 838 M 1720 820 L 1720 838" />
    <text class="mono" x="1000" y="880" text-anchor="middle">0</text>
    <text class="mono" x="1240" y="880" text-anchor="middle">10</text>
    <text class="mono" x="1480" y="880" text-anchor="middle">20</text>
    <text class="mono" x="1720" y="880" text-anchor="middle">30</text>
    <text class="mono" x="1360" y="950" text-anchor="middle">minutes after waking</text>
  </g>
  <!-- The level at waking, the mouth's height, carried across the axis as a rule -->
  <path class="line rule draw" pathLength="1" style="--t:7600ms; --d:500ms" d="M 1000 650 L 1720 650" />

  <!-- The figure, as the curve reaches its top -->
  <text class="figure in" style="--t:10800ms" x="1720" y="280" text-anchor="end">50 to 75 percent</text>
</svg>
<script>
  // Pruessner et al. (1997): free cortisol rises by roughly fifty to seventy-five percent in
  // the thirty minutes after waking. The curve leaves the mouth at the waking level, runs along
  // it to the axis's zero and rises to its top at thirty minutes. Its shape between the two
  // ends is a drawing, not a measurement; the minutes on the axis are the only measured thing.
  const mx = 706, my = 650, x0 = 1000, x30 = 1720, yTop = 330;
  let d = `M ${mx} ${my} C ${mx + 90} ${my + 2}, ${x0 - 120} ${my}, ${x0} ${my}`;
  for (let i = 1; i <= 120; i++) {
    const t = 30 * i / 120;
    const v = (1 - Math.cos(Math.PI * t / 30)) / 2;
    d += ' L ' + (x0 + (x30 - x0) * t / 30).toFixed(1) + ' ' + (my - (my - yTop) * v).toFixed(1);
  }
  document.getElementById('rise').setAttribute('d', d);
</script>
</body>
</html>
