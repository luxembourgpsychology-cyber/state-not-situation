<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>M5 Chronic stress</title>
<meta name="description" content="Episode 1, section 10, second pass. The standing figure twice, side by side. On the left, near onset, a day curve rises high out of the adrenal at the mid-back and comes down again; on the right, persisting, the same figure drawn a little more slumped, with a lower, flatter day curve out of the same gland (Miller, Chen and Zhou, 2007). Nothing is red.">
<meta name="motion:duration" content="14000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono&family=Barlow+Semi+Condensed:wght@700&display=swap">
<style>
  :root {
    --cream: #F7F3EC; --ink: #111111; --quiet: #6F6A62; --red: #B5291C; --rule: rgba(17,17,17,.14);
    --serif: "Instrument Serif", "Liberation Serif", "Times New Roman", serif;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
    --hand: cubic-bezier(.45,.05,.55,.95);
  }
  html, body { margin: 0; background: var(--cream); }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
  svg.frame { display: block; width: 1920px; height: 1080px; }
  .line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  /* The figures are the M1 figure at 0.72; the stroke is held at 3px on the frame. */
  .small .line { stroke-width: 4.1667; }
  .serif { font-family: var(--serif); font-weight: 400; font-size: 77px; fill: var(--ink); }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--d) var(--hand) var(--t) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .in { opacity: 0; animation: enter 400ms ease-out var(--t) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<svg class="frame" viewBox="0 0 1920 1080" aria-label="Daily cortisol out of the body near the onset of a stressor, and as it persists">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#hand)">
    <!-- Near onset: the M1 figure, standing, facing left, drawn head, neck, back, front, arm, legs -->
    <g class="small" transform="translate(-60 274) scale(0.72)">
      <path class="line draw" pathLength="1" style="--t:300ms; --d:550ms"
        d="M 472 125 C 506 126, 532 156, 531 188 C 530 222, 500 246, 468 245 C 436 244, 410 218, 411 186 C 412 154, 438 126, 470 125" />
      <path class="line draw" pathLength="1" style="--t:900ms; --d:180ms" d="M 508 238 L 520 274 M 446 238 L 441 272" />
      <path class="line draw" pathLength="1" style="--t:1120ms; --d:600ms"
        d="M 520 274 C 552 276, 592 286, 606 318 C 626 410, 622 520, 608 600 C 598 650, 604 700, 606 722" />
      <path class="line draw" pathLength="1" style="--t:1760ms; --d:550ms"
        d="M 441 272 C 428 290, 418 330, 422 380 C 416 450, 422 540, 430 610 C 433 660, 428 700, 436 722" />
      <path class="line draw" pathLength="1" style="--t:2350ms; --d:350ms" d="M 576 306 C 536 400, 505 520, 492 628" />
      <path class="line draw" pathLength="1" style="--t:2750ms; --d:400ms" d="M 470 726 C 474 810, 472 900, 468 982 L 418 988" />
      <path class="line draw" pathLength="1" style="--t:3180ms; --d:400ms" d="M 556 726 C 560 810, 564 900, 564 982 L 514 988" />
      <!-- At the mid-back: two kidneys, each capped by its adrenal -->
      <path class="line draw" pathLength="1" style="--t:3700ms; --d:300ms"
        d="M 544 542 C 560 541, 565 560, 563 580 C 561 596, 548 600, 540 592 C 533 585, 533 568, 536 556 C 538 548, 540 543, 544 542" />
      <path class="line draw" pathLength="1" style="--t:4050ms; --d:300ms"
        d="M 579 556 C 595 555, 600 575, 598 596 C 596 612, 583 616, 575 608 C 568 601, 568 584, 571 571 C 573 562, 575 557, 579 556" />
      <path class="line draw" pathLength="1" style="--t:4400ms; --d:150ms" d="M 536 544 C 540 532, 554 530, 561 540" />
      <path class="line draw" pathLength="1" style="--t:4600ms; --d:150ms" d="M 571 558 C 575 546, 589 544, 596 554" />
    </g>
    <!-- The day, out of the gland: high, and down again -->
    <path id="onset" class="line draw" pathLength="1" style="--t:5100ms; --d:1400ms" d="" />

    <!-- Persisting: the same figure, drawn a little more slumped. The slump is a drawing device. -->
    <g class="small" transform="translate(900 274) scale(0.72)">
      <path class="line draw" pathLength="1" style="--t:7200ms; --d:550ms"
        d="M 450 151 C 484 152, 510 182, 509 214 C 508 248, 478 272, 446 271 C 414 270, 388 244, 389 212 C 390 180, 416 152, 448 151" />
      <path class="line draw" pathLength="1" style="--t:7800ms; --d:180ms" d="M 488 262 L 524 290 M 426 262 L 441 284" />
      <path class="line draw" pathLength="1" style="--t:8020ms; --d:600ms"
        d="M 524 290 C 562 290, 608 300, 620 338 C 640 422, 630 520, 610 600 C 600 650, 604 700, 606 722" />
      <path class="line draw" pathLength="1" style="--t:8660ms; --d:550ms"
        d="M 441 284 C 428 302, 420 338, 424 386 C 418 452, 422 540, 430 610 C 433 660, 428 700, 436 722" />
      <path class="line draw" pathLength="1" style="--t:9250ms; --d:350ms" d="M 590 326 C 546 412, 508 522, 494 628" />
      <path class="line draw" pathLength="1" style="--t:9650ms; --d:400ms" d="M 470 726 C 474 810, 472 900, 468 982 L 418 988" />
      <path class="line draw" pathLength="1" style="--t:10080ms; --d:400ms" d="M 556 726 C 560 810, 564 900, 564 982 L 514 988" />
      <path class="line draw" pathLength="1" style="--t:10600ms; --d:300ms"
        d="M 544 542 C 560 541, 565 560, 563 580 C 561 596, 548 600, 540 592 C 533 585, 533 568, 536 556 C 538 548, 540 543, 544 542" />
      <path class="line draw" pathLength="1" style="--t:10950ms; --d:300ms"
        d="M 579 556 C 595 555, 600 575, 598 596 C 596 612, 583 616, 575 608 C 568 601, 568 584, 571 571 C 573 562, 575 557, 579 556" />
      <path class="line draw" pathLength="1" style="--t:11300ms; --d:150ms" d="M 536 544 C 540 532, 554 530, 561 540" />
      <path class="line draw" pathLength="1" style="--t:11500ms; --d:150ms" d="M 571 558 C 575 546, 589 544, 596 554" />
    </g>
    <!-- The day, out of the same gland: lower, flatter -->
    <path id="persisting" class="line draw" pathLength="1" style="--t:12000ms; --d:1400ms" d="" />
  </g>

  <text class="serif in" style="--t:4900ms" x="235" y="200">near onset</text>
  <text class="serif in" style="--t:11800ms" x="1195" y="200">persisting</text>
</svg>
<script>
  // Miller, Chen and Zhou (2007): output highest near the onset of a stressor and declining as
  // it persists. Each curve leaves the right adrenal at the mid-back, keeps the daily shape, high
  // in the morning and low at night, and returns to the gland's height. Neither carries a value;
  // the height, the breadth and the shape are a drawing. There is no axis on the frame.
  const curve = (gx, gy, width, H, sl, sr) => {
    const lv = h => { const s = h < 8 ? sl : sr; return Math.exp(-((h - 8) ** 2) / (2 * s * s)); };
    const l0 = lv(0);
    let d = '';
    for (let i = 0; i <= 240; i++) {
      const h = 24 * i / 240;
      const L = (lv(h) - l0) / (1 - l0);
      d += (i ? ' L ' : 'M ') + (gx + width * h / 24).toFixed(1) + ' ' + (gy - H * Math.max(0, L)).toFixed(1);
    }
    return d;
  };
  // The gland on the frame: M1's right adrenal at (586, 544), through each figure's transform.
  document.getElementById('onset').setAttribute('d', curve(-60 + 0.72 * 586, 274 + 0.72 * 544, 520, 370, 1.8, 5.5));
  document.getElementById('persisting').setAttribute('d', curve(900 + 0.72 * 586, 274 + 0.72 * 544, 520, 150, 2.4, 7.0));
</script>
</body>
</html>
