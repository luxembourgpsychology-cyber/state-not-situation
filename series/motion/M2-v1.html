<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>M2 A day</title>
<meta name="description" content="Episode 1, section 7. The daily rhythm of cortisol, high in the morning and low at night, the hourly pulses riding on it, and one sample on the steep morning rise.">
<meta name="motion:duration" content="10000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono&family=Barlow+Semi+Condensed:wght@700&display=swap">
<style>
  :root {
    --cream: #F7F3EC; --ink: #111111; --quiet: #6F6A62; --red: #B5291C; --rule: rgba(17,17,17,.14);
    --serif: "Instrument Serif", "Liberation Serif", "Times New Roman", serif;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  html, body { margin: 0; background: var(--cream); }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
  svg.frame { display: block; width: 1920px; height: 1080px; }
  .line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--mono); font-size: 36px; letter-spacing: .08em; text-transform: uppercase; fill: var(--quiet); }
  .serif { font-family: var(--serif); font-weight: 400; font-size: 77px; fill: var(--ink); }
  .sample { fill: var(--red); }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--d) linear var(--t) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .in { opacity: 0; animation: enter 400ms ease-out var(--t) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<svg class="frame" viewBox="0 0 1920 1080" aria-label="Cortisol across a day">
  <!-- The 24-hour axis -->
  <path class="line draw" pathLength="1" style="--t:300ms; --d:700ms" d="M 240 820 L 1824 820" />
  <g class="in" style="--t:1000ms">
    <path class="line" d="M 636 820 L 636 840 M 1032 820 L 1032 840 M 1428 820 L 1428 840 M 1824 820 L 1824 840" />
    <text class="mono" x="636" y="890" text-anchor="middle">06</text>
    <text class="mono" x="1032" y="890" text-anchor="middle">12</text>
    <text class="mono" x="1428" y="890" text-anchor="middle">18</text>
    <text class="mono" x="1824" y="890" text-anchor="middle">24</text>
  </g>

  <!-- The daily curve, high in the morning and low at night -->
  <path id="day" class="line draw" pathLength="1" style="--t:1600ms; --d:2600ms" d="" />
  <!-- The hourly pulses, riding on it -->
  <path id="pulses" class="line draw" pathLength="1" style="--t:4600ms; --d:2600ms" d="" />

  <!-- One sample on the steep morning rise -->
  <circle id="sample" class="sample in" style="--t:7800ms" cx="0" cy="0" r="11" />
  <text class="serif in" style="--t:8400ms" x="615" y="425" text-anchor="end">one sample</text>
</svg>
<script>
  // The shape is the one Lightman and Conway-Campbell (2010) describe: a circadian rhythm,
  // high in the morning and low at night, with an ultradian pulse roughly every hour.
  // No value on it is a measurement; only the hours on the axis are.
  const x0 = 240, x24 = 1824, base = 820, height = 420;
  const X = h => x0 + (x24 - x0) * h / 24;
  const level = h => {
    const s = h < 8 ? 1.8 : 5.5;
    return 0.08 + 0.92 * Math.exp(-((h - 8) ** 2) / (2 * s * s));
  };
  const bump = h => {
    const f = h - Math.floor(h);
    return Math.pow(Math.sin(Math.PI * f), 4) * (0.04 + 0.08 * level(h));
  };
  const pts = (fn, n) => {
    let d = '';
    for (let i = 0; i <= n; i++) {
      const h = 24 * i / n;
      d += (i ? ' L ' : 'M ') + X(h).toFixed(1) + ' ' + (base - height * fn(h)).toFixed(1);
    }
    return d;
  };
  document.getElementById('day').setAttribute('d', pts(level, 240));
  document.getElementById('pulses').setAttribute('d', pts(h => level(h) + bump(h), 960));
  const hs = 6.5;
  const s = document.getElementById('sample');
  s.setAttribute('cx', X(hs).toFixed(1));
  s.setAttribute('cy', (base - height * (level(hs) + bump(hs))).toFixed(1));
</script>
</body>
</html>
